return `<div class="cd"><div class="row"><b>${j.n}</b><span class="pill">krok ${J.s+1}/3</span></div><div class="mu">${CARS[o.car][0]} · ${o.cl}</div><p><b>${lb}</b></p>${b}</div><button class="g" onclick="A('abort')">Przerwij (część przepada)</button>`}
function ordH(){let h='<h2>Zlecenia klientów</h2>';
S.orders.forEach(o=>{const j=JOBS[o.j],ok=can(o),it=ITEMS.find(x=>x.id==j.i),np=S.parts[j.pn]||0;
h+=`<div class="cd"><div class="row"><div><b>${j.n}</b>${j.hp?' <span class="pill">tuning +'+j.hp+' KM</span>':''}<div class="mu">${o.cl} · ${CARS[o.car][0]}</div><div class="mu">Część: ${j.pn} (masz ${np})</div>${ok?'':`<div class="mu">🔒 ${S.br[j.i]?'Awaria: '+it.n:'Wymaga: '+it.n+' poz. '+j.l}</div>`}</div><b style="color:var(--ok)">${fmt(o.p)}</b></div>
<div class="row" style="margin-top:8px"><button class="s" onclick="A('start','${o.id}')">Rozpocznij</button><button class="s g" onclick="A('skip','${o.id}')">Odrzuć</button></div></div>`});return h}
function eqH(){let h='<h2>Sprzęt warsztatu</h2>';ITEMS.forEach(it=>{const l=S.items[it.id],c=Math.round(it.b*Math.pow(2.1,l)),mx=l>=it.max,br=S.br[it.id],fc=Math.round(it.b*Math.pow(2.1,Math.max(0,l-1))*.25);
h+=`<div class="cd"><b>${it.n}</b> <span class="pill">poz. ${l}/${it.max}</span>${br?' <span class="pill" style="background:var(--ac);color:#fff">awaria</span>':''}<div class="mu">${it.d}</div><div class="row" style="margin-top:8px">${br?`<button ${S.money<fc?'disabled':''} onclick="A('fix','${it.id}')">Napraw · ${fmt(fc)}</button>`:''}<button class="${br?'g':''}" ${mx||S.money<c?'disabled':''} onclick="A('buy','${it.id}')">${mx?'Maks.':(l?'Ulepsz':'Kup')+' · '+fmt(c)}</button></div></div>`});
h+='<h2>Części</h2>';JOBS.forEach((j,i)=>{h+=`<div class="cd row"><div><b>${j.pn}</b><div class="mu">do: ${j.n} · masz: ${S.parts[j.pn]||0}</div></div><div style="display:flex;gap:6px"><button class="s" ${S.money<j.pc?'disabled':''} onclick="A('bp','${i},1')">${fmt(j.pc)}</button><button class="s g" ${S.money<j.pc*5?'disabled':''} onclick="A('bp','${i},5')">×5</button></div></div>`});return h}
function garH(){let h=`<h2>Moje auta (${S.own.length}/4)</h2>`;
if(!S.own.length)h+='<div class="cd mu">Brak aut. Kup auto na giełdzie, napraw usterki, podrasuj i sprzedaj z zyskiem.</div>';
S.own.forEach((c,i)=>{const t=c.t<4?JOBS[7+c.t]:null;h+=`<div class="cd"><div class="row"><b>${c.n}</b><b style="color:var(--ok)">${fmt(val(c))}</b></div>${carSvg(c.v,64)}<div class="mu">${c.hp} KM · ${c.e} · usterek: ${c.d.length}</div>`+
c.d.map(ji=>`<button class="s g" style="margin:6px 6px 0 0" onclick="A('rep','${i},${ji}')">🔧 ${JOBS[ji].n}</button>`).join('')+
(t?`<button class="s" style="margin:6px 6px 0 0" onclick="A('tun','${i},${7+c.t}')">⚡ ${t.n} (+${t.hp} KM)</button>`:'')+`<button class="s g" style="margin-top:6px" onclick="A('sell',${i})">Sprzedaj</button></div>`});
h+=`<div class="row"><h2>Giełda używanych</h2><button class="s g" onclick="A('mref')">Odśwież · 100 zł</button></div>`;
S.mkt.forEach((c,i)=>h+=`<div class="cd"><div class="row"><div><b>${c.n}</b><div class="mu">${c.hp} KM · ${c.e}</div><div class="mu">usterki: ${c.d.map(x=>JOBS[x].n).join(', ')}</div><div class="mu">Wartość teraz: ${fmt(val(c))}</div></div><button class="s" ${S.money<c.p?'disabled':''} onclick="A('buy2',${i})">${fmt(c.p)}</button></div></div>`);
h+=`<h2>Katalog aut (${N})</h2><button class="g" style="margin-bottom:10px" onclick="A('cat')">${cat?'Ukryj listę':'Pokaż listę'}</button>`;
if(cat)h+=CARS.map((c,i)=>{const L=minLv(i);return `<div class="cd row"><div><b>${c[0]}</b><div class="mu">${c[1]} KM · ${c[3]} · wartość ${fmt(c[2])}</div></div><span class="pill">${L<=lv()?'dostępne':'🔒 poz. '+L}</span></div>`}).join('');return h}
function dynH(){const L=all();if(!S.items.dyno)return '<div class="cd"><b>Brak hamowni</b><div class="mu">Kup hamownię w sklepie, aby mierzyć moc i stroić auta.</div></div>';
if(!L.length)return '<div class="cd"><b>Brak aut do testu</b><div class="mu">Wykonaj zlecenie tuningowe lub kup własne auto w garażu.</div></div>';
if(!dy||!L[dy.car])dy={car:L.length-1};const c=L[dy.car],own=dy.car>=S.cars.length;
let h=`<h2>Hamownia</h2><div class="cd"><select style="width:100%;font:inherit;padding:10px;border-radius:10px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)" onchange="A('pick',this.value)">${L.map((x,i)=>`<option value="${i}" ${i==dy.car?'selected':''}>${x.n} (${x.st})</option>`).join('')}</select>
<div class="mu" style="margin:8px 0">Seria: ${c.base} KM · baza ${c.hp} KM${c.best?' · rekord: <b>'+c.best+' KM</b>':''}${c.e?'<br>Silnik: '+c.e:''}</div>`;
if(own){const e=ev(c,c.tn);h+='<b>Strojenie</b>'+[['ig','Zapłon',-10,10,.5],['afr','Mieszanka AFR',10.5,14.7,.1]].concat(e.T?[['bo','Doładowanie',.5,2.2,.05]]:[]).map(([k,n,a,b,st])=>`<div class="row"><span>${n}</span><b id="v_${k}">${fv(k,c.tn[k])}</b></div><input type="range" style="width:100%" min="${a}" max="${b}" step="${st}" value="${c.tn[k]}" oninput="tn('${k}',this.value)">`).join('')+(e.T?`<div class="mu">Bezpieczne doładowanie tej turbiny: ok. ${e.safe.toFixed(1)} bar</div>`:'<div class="mu">Silnik wolnossący — brak doładowania.</div>')}
h+=`<canvas id="cv" width="340" height="190" style="margin-top:8px"></canvas><div id="lv" class="mu" style="text-align:center;margin:6px 0">Gotowy do pomiaru</div><div id="hn" class="mu" style="text-align:center;margin-bottom:6px">${dy.hint||''}</div><button id="rb" onclick="A('run')">Uruchom pomiar</button></div>`;
if(own){const tray=MODS.map(([k,n,o])=>{const l=c.m[k]||0,nx=o[l];return nx?`<div class="pc" onpointerdown="dg(event,'${k}')"><svg viewBox="0 0 64 64"><use href="#p-${k}"/></svg><b>${nx[0]}</b><span>${fmt(nx[1])}</span>${S.items.tune<nx[3]?'<span>🔒 zestaw poz. '+nx[3]+'</span>':''}</div>`:`<div class="pc" style="opacity:.5"><svg viewBox="0 0 64 64"><use href="#p-${k}"/></svg><b>${n}</b><span>max</span></div>`}).join('');
h+=`<h2>🔩 Komora silnika</h2><div class="cd"><div class="mu" style="margin-bottom:8px">Przeciągnij część z półki na właściwe miejsce w silniku.</div>${bay(c)}<div class="tray">${tray}</div></div><h2>🎨 Wygląd</h2><div class="cd">${carSvg(c.v,100)}<div class="mu">Lakier (250 zł)</div><div class="sw">${COL.map(x=>`<i style="background:${x}" onclick="A('cv','col,${x}')"></i>`).join('')}</div>`+
[['w','Felgi',['Seryjne','Sportowe','Złote']],['sp','Spoiler',['Brak','Lip','Skrzydło']],['ng','Neon',['Brak','Neon']]].map(([k,n,o])=>`<div class="mu">${n}</div><div class="row" style="gap:6px;margin-bottom:8px">${o.map((t,i)=>`<button class="s ${c.v[k]==i?'':'g'}" style="flex:1;padding:8px 4px" onclick="A('cv','${k},${i}')">${t}${CV[k][i]?'<br>'+fmt(CV[k][i]):''}</button>`).join('')}</div>`).join('')+'</div>'}
return h}
function pauseH(){const f=S.fol,tier=f<200?'Początkujący':f<1000?'Lokalny warsztat':f<5000?'Znany w mieście':f<20000?'Influencer':'Gwiazda tuningu',ad=Math.round(100+f*.3);
let h=`<h2>📸 Instagram</h2><div class="cd"><div class="row"><b>${f.toLocaleString('pl-PL')} obserwujących</b><span class="pill">${tier}</span></div><div class="mu">Bonus do zarobków: +${Math.round((pm()-1)*100)}% · zleceń naraz: ${tg()}</div><div class="row" style="margin-top:8px;gap:8px"><button onclick="A('post')">Wstaw post</button><button class="g" ${S.money<ad?'disabled':''} onclick="A('ad')">Reklama · ${fmt(ad)}</button></div></div><h2>🏦 Bank</h2><div class="cd">`;
if(S.loan>0)h+=`<b>Dług: ${fmt(S.loan)}</b><div class="mu">25% płatności za zlecenia idzie na spłatę.</div><div class="row" style="margin-top:8px;gap:8px"><button ${S.money<=0?'disabled':''} onclick="A('rp',0)">Spłać wszystko</button><button class="g" onclick="A('rp',500)">Spłać 500</button></div>`;
else h+='<div class="mu" style="margin-bottom:8px">Pożyczka z oprocentowaniem 15%, jedna naraz.</div>'+[[500,1],[1000,3],[2000,5]].map(([a,l])=>`<button class="g" style="margin-bottom:8px" ${lv()<l?'disabled':''} onclick="A('loan',${a})">${lv()<l?'🔒 poz. '+l+' · ':''}Weź ${fmt(a)} (do zwrotu ${fmt(a*1.15)})</button>`).join('');
return h+`</div><h2>Menu</h2><div class="cd mu">Autozapis po każdym zleceniu i zakupie. Slot: ${slot}.</div><div class="mn" style="padding:0"><button onclick="A('save')">💾 Zapisz grę</button><button class="g" onclick="A('exit')">Zapisz i wyjdź do menu</button><button class="g" onclick="A('quit')">Wyjdź bez zapisu</button></div>`}
function curve(P,n){const hp=[],nm=[];for(let i=0;i<=n;i++){const x=i/n,r=1500+x*5500,h=P*Math.max(.12,Math.sin(Math.PI/2*Math.min(1,x/.75))*(1-.35*Math.pow(Math.max(0,(x-.75)/.25),2)));hp.push(h);nm.push(h*7023/r)}return{hp,nm}}
function draw(p){const cv=$('#cv');if(!cv||!dy||!dy.c)return;const g=cv.getContext('2d'),W=340,H=190,cs=getComputedStyle(document.documentElement),ac=cs.getPropertyValue('--ac'),bl=cs.getPropertyValue('--bl'),mu=cs.getPropertyValue('--mu');
g.clearRect(0,0,W,H);g.strokeStyle=mu;g.globalAlpha=.3;for(let i=1;i<5;i++){g.beginPath();g.moveTo(0,i*H/5);g.lineTo(W,i*H/5);g.stroke()}g.globalAlpha=1;
const n=dy.c.hp.length-1,mh=Math.max(...dy.c.hp)*1.1,mn=Math.max(...dy.c.nm)*1.1;
[[dy.c.hp,mh,ac],[dy.c.nm,mn,bl]].forEach(([a,m,col])=>{g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();for(let i=0;i<=n*p;i++){const x=i/n*W,y=H-a[i]/m*(H-10)-5;i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()});
g.fillStyle=ac;g.font='12px sans-serif';g.fillText('KM',6,14);g.fillStyle=bl;g.fillText('Nm',34,14)}
function runDyno(){if(!dy||dy.run)return;const c=all()[dy.car],own=dy.car>=S.cars.length;dy.run=true;let P,hint='';
if(own){const e=ev(c,c.tn);P=e.pk*(.99+Math.random()*.02);const d=c.tn.afr-e.afs,k=c.tn.ig-e.igs;
hint=`AFR ${c.tn.afr.toFixed(1)}: ${d>.6?'za ubogo':d<-.6?'za bogato':'w porządku'} · Stuk: ${k>2.5?'silny':k>1?'lekki':'brak'}${e.T&&c.tn.bo>e.safe?' · ciśnienie ponad limit turbiny':''}`;
if(Math.random()<e.r){P*=.75;if(!c.d.includes(5))c.d.push(5);hint='💥 Spalanie stukowe! Silnik uszkodzony ('+JOBS[5].n+'). '+hint}}
else P=c.hp*(.97+Math.random()*.05);
dy.hint=hint;dy.c=curve(P,100);$('#rb').disabled=true;const t0=performance.now(),D=4000;
(function f(t){const p=Math.min(1,(t-t0)/D);draw(p);const i=Math.round(p*100),el=$('#lv');if(el)el.textContent=Math.round(1500+p*5500)+' obr/min · '+Math.round(dy.c.hp[i])+' KM · '+Math.round(dy.c.nm[i])+' Nm';
if(p<1)return requestAnimationFrame(f);dy.run=false;const pk=Math.round(Math.max(...dy.c.hp)),nmx=Math.round(Math.max(...dy.c.nm));let m='';
if(!c.best){const b=100*S.items.dyno;S.money+=b;S.xp+=15;m=' · premia '+fmt(b)}c.best=Math.max(c.best,pk);S.fol+=Math.round(pk/8);save();
if(el)el.innerHTML='Wynik: <b>'+pk+' KM</b> · <b>'+nmx+' Nm</b>'+m;const hn=$('#hn');if(hn)hn.textContent=hint;const rb=$('#rb');if(rb){rb.disabled=false;rb.textContent='Pomiar ponownie'}toast('Pomiar: '+pk+' KM')})(t0)}
function render(){const a=$('#app');if(scr=='menu')a.innerHTML=menuH();else if(scr=='slots')a.innerHTML=slotsH();else{a.innerHTML=head()+'<main>'+(S.job?workH():rc?raceH():({o:ordH,e:eqH,g:garH,d:dynH,z:zawH,m:pauseH}[tab])())+'</main>'+(S.job||rc?'':nav());if(!S.job&&tab=='d'&&dy&&dy.c&&!dy.run)draw(1)}}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
